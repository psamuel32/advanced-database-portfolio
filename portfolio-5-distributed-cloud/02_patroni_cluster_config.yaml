scope: apexpay-db-cluster
namespace: /service
name: pg-node-frankfurt-01

dcs:
  ttl: 30
  loop_wait: 10
  retry_timeout: 10
  maximum_lag_on_failover: 1048576 # Max 1MB WAL lag for promotion
  synchronous_mode: true
  synchronous_mode_strict: true # Prevent writes if sync standby down

etcd3:
  hosts:
    - 10.0.1.10:2379
    - 10.0.1.11:2379
    - 10.0.1.12:2379

bootstrap:
  dcs:
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        shared_buffers: 4GB
        work_mem: 64MB
        maintenance_work_mem: 512MB
        wal_level: replica
        max_connections: 500

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.0.1.20:5432
  data_dir: /var/lib/postgresql/16/main
  pgpass: /var/lib/postgresql/.pgpass
  authentication:
    replication:
      username: replicator
    superuser:
      username: postgres
